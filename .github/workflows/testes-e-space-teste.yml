name: Testes e Space de teste

# Roda em toda branch que nao seja a main. A main tem fluxo proprio (sync.yml), que publica
# em producao. A regra de trabalho e: nada vai para producao sem passar por aqui e sem
# conferencia no Space de teste.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # A versao do Gradio vem do sdk_version do README — o mesmo numero que o Space le.
      # Assim o teste roda na versao que vai rodar em producao, e nao na mais recente do PyPI.
      - name: Descobrir a versao de Gradio do Space
        id: sdk
        run: |
          VERSAO=$(grep -m1 '^sdk_version:' README.md | sed 's/[^0-9.]//g')
          if [ -z "$VERSAO" ]; then
            echo "sdk_version nao encontrado no README.md" >&2
            exit 1
          fi
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"
          echo "Gradio do Space: $VERSAO"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "gradio==${{ steps.sdk.outputs.versao }}" pytest

      - name: Conferir que a versao instalada e a do Space
        run: |
          INSTALADA=$(python -c "import gradio; print(gradio.__version__)")
          echo "instalada: $INSTALADA | esperada: ${{ steps.sdk.outputs.versao }}"
          [ "$INSTALADA" = "${{ steps.sdk.outputs.versao }}" ]

      - name: Rodar os testes
        run: pytest tests/ -q

  deploy-teste:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Publicar no Space de teste
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN nao esta configurado no repositorio" >&2
            exit 1
          fi
          cd /tmp
          mkdir hf_push && cd hf_push
          cp -r $GITHUB_WORKSPACE/. .
          find . -name "*.pyc" -delete
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          # O Space e publico: documentacao e configuracao internas nao vao.
          rm -rf .git .github .claude .venv_test .venv_space
          rm -f CLAUDE.md
          git init
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add .
          git commit -m "deploy de teste: ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          git branch -M main
          git remote add hf https://olivbernardo:$HF_TOKEN@huggingface.co/spaces/olivbernardo/analise_matriculas_teste
          git push hf main --force

      - name: Onde conferir
        run: echo "https://huggingface.co/spaces/olivbernardo/analise_matriculas_teste"
